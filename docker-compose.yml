services:
  # 1. Evolution API (Grátis - faz o pareamento do WhatsApp pelo número + código de 8 dígitos)
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: ofertapro-evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-OfertaProChaveSecreta2026}
      - DEL_INSTANCE=false
      - DATABASE_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    volumes:
      - evolution_instances:/evolution/instances

  # 2. Backend do OfertaPro (Vitrine, Multi-Usuário SQLite, API Shopee e Agendador 24h)
  ofertapro-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ofertapro-backend
    restart: always
    depends_on:
      - evolution-api
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - JWT_SECRET=${JWT_SECRET:-TroquePorUmaChaveSuperSecreta2026}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-OfertaProChaveSecreta2026}
      - SHOPEE_APP_ID=${SHOPEE_APP_ID:-}
      - SHOPEE_APP_SECRET=${SHOPEE_APP_SECRET:-}
      - MERCADOLIVRE_AFFILIATE_TAG=${MERCADOLIVRE_AFFILIATE_TAG:-}
      - AMAZON_ASSOCIATE_TAG=${AMAZON_ASSOCIATE_TAG:-}
      - ALIEXPRESS_APP_KEY=${ALIEXPRESS_APP_KEY:-}
    volumes:
      - ./backend/data:/app/data

volumes:
  evolution_instances:
